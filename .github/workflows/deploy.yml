name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# 同じブランチ(PR)で同時に走った場合は、最新の実行だけを残す。
# PRごとにグループを分け、別PRのビルドを打ち切らないようにする。
# main への push(デプロイ)は打ち切らず、順番に実行する。
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # YAML のスキーマ検証 (Zod) はビルド時に Astro が行うため、
  # ビルドが通ること自体がスキーマ検証を兼ねる (docs/design.md 10)。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # .astro / .ts の型チェック(astro check)。astro build は型エラーがあっても止まらない
      # ため、ビルドの前に実行し、型エラーがあれば build ジョブを失敗させる(Issue #230)。
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # main への push 時のみ GitHub Pages に公開する (pull_request では公開しない)。
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
