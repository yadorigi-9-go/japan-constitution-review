excerpt: "自民党は、平成三十年に、他の三項目とともに、緊急事態に関するたたき台の素案を取りまとめて発表いたしました。「国会は、法律で定めるところにより、各議院の出席議員の三分の二以上の多数で、その任期の特例を定めることができる。」"
summary: "自由民主党の船田元衆議院議員が、2018年(平成30年)に自民党が公表した「条文イメージ(たたき台素案)」の第64条の2(選挙実施困難時に各議院の出席議員の3分の2以上の多数で議員任期の特例を定められるとする規定)を紹介し、その後の憲法審査会での議論でも議決要件を3分の2以上とする点はおおむね一致していると説明した。"
