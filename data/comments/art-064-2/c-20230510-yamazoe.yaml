excerpt: "日本国憲法が議員任期の延長を定めず、衆議院の総選挙の間は参議院の緊急集会により対応することとしたのは、この痛苦の歴史を踏まえたものにほかなりません。"
summary: "日本共産党の山添拓参議院議員が、自民党の2018年条文イメージ(たたき台素案)などが緊急事態に議員任期を延長する特例を盛り込んでいることに触れた。明治憲法下で1941年に衆議院議員の任期が延長された経緯を挙げ、日本国憲法が任期延長を定めず参議院の緊急集会で対応することとしたのはその歴史を踏まえたものだと述べた。"
