excerpt: "この憲法草案の前文では、国を守ることが国民の義務だということに規定されております。そうすると、国の義務を守る行為、これは苦役なんでしょうか。"
summary: "民主党・新緑風会の小川敏夫参議院議員が、自民党2012年改憲草案の前文にある「国を守ることは国民の責務」という規定と、18条の意に反する苦役の禁止との関係について、国防の義務を果たす行為が苦役に当たらないのか安倍総理(当時)に質問した。"
