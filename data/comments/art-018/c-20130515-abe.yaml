excerpt: "徴兵制については、現憲法でも今引いた条文において規定されているわけでありますし、また、同じ十八条で、それは自民党憲法においてもそのまま、ほぼそのまま残っておりますので、自民党憲法においてもそれは、徴兵制度については認められないという考え方であります。"
summary: "安倍晋三内閣総理大臣(自民党総裁)が、小川敏夫議員の質問に対し、2012年改憲草案においても18条の苦役禁止規定はほぼそのまま維持されており、国を守る義務を理由とした徴兵制は自民党の改正案でも認められないとの考えを答弁した。"
