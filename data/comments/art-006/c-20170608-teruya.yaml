excerpt: "自民党日本国憲法改正草案第六条第四項では、現憲法第七条において天皇の国事行為に内閣の助言と承認を必要と規定しているのを、「内閣の進言」に変更しています。進言とは、目上の者に対して意見することを指す言葉です。天皇が上、内閣は下。"
summary: "社会民主党の照屋寛徳衆議院議員が、自民党2012年憲法改正草案第6条第4項で天皇の国事行為に対する内閣の「助言と承認」が「進言」に変更されている点を取り上げ、「進言」は目上の者への意見表明を意味する語であるとして、天皇を上位、内閣を下位に置く構図になっていると指摘した。"
