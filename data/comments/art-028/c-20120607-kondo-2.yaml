excerpt: "現行憲法下においても、国家公務員の労働条件に関する人事院勧告などの代償措置が講じられていることを条件として、公務員の労働基本権は制限されています。このことについて憲法上も明文化したものです。"
summary: "自由民主党の近藤三津枝衆議院議員(憲法審査会)が、自民党の日本国憲法改正草案の補足説明として、第28条第2項に公務員の労働基本権の全部又は一部を法律で制限できる規定と、勤労条件を改善するための必要な措置の規定を新設したと説明した。現行憲法下でも人事院勧告などの代償措置を条件に公務員の労働基本権は制限されており、これを憲法上明文化したものだと述べた。"
