excerpt: "二〇一二年自民党改憲草案は、第九章として緊急事態の章を立て、①内閣総理大臣が、武力攻撃、内乱、大規模災害などの緊急事態において、特に必要を認めれば、緊急事態の宣言を発すること、"
summary: "日本共産党の仁比聡平参議院議員(憲法審査会)が、衆議院議員の任期の特例をめぐる議論は2012年の自民党改憲草案の緊急事態条項と一体のものだとした上で、同草案が内閣総理大臣による緊急事態の宣言、法律と同一の効力を有する政令の制定、国会議員の任期の特例などを定めていると説明し、立憲主義の破壊であり許されないと述べた。"
