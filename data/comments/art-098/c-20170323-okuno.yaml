excerpt: "私、自民党の改憲草案を見ましたけれども、緊急事態もその他の法律で定める場合と極めて広いですし、松浦参考人自体もお認めのように緊急政令の範囲も極めて曖昧であります。"
summary: "民進党・無所属クラブの奥野総一郎衆議院議員(憲法審査会)が、参考人への質疑の中で、自民党の改憲草案は緊急事態を「その他の法律で定める」場合まで含めて広く定めており、緊急政令の範囲も曖昧であるとして、一般的な緊急事態条項は日本国憲法に必要ないとの考えを述べた。"
