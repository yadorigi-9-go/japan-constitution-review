summary: "れいわ新選組の奥田ふみよ参議院議員が、国民投票法改正案(CM規制等の不備)に反対する中で、資金力のある側が緊急事態条項の創設を改憲のきっかけにしようとしていると指摘。緊急事態を理由に選挙を先送りし、国民の意思を無視した政権に権限が集中する懸念を訴えた。"
