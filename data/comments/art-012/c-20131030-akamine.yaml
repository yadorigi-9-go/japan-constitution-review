excerpt: "要するに、国家の安全保障政策のためには基本的人権の制約は甘んじて受け入れよ、国策には協力せよということであります。"
summary: "日本共産党の赤嶺政賢衆議院議員が、自民党2012年改憲草案第12条の「自由及び権利には責任及び義務が伴うことを自覚し、常に公益及び公の秩序に反してはならない」との規定を取り上げ、国家の安全保障政策のために基本的人権の制約を受け入れ国策に協力することを求める国家主義的な発想だと批判した。"
