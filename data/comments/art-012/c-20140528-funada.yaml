summary: "自由民主党の船田元参議院議員が、草案第12条で「公共の福祉」を「公益及び公の秩序」に改めた理由について、従来の「公共の福祉」という表現が曖昧で分かりにくいと批判されてきたことに加え、現に行われている人権の制約(例:町の美観や性道徳の維持など)を人権相互の衝突という理論だけでは説明できないことを踏まえたものだと説明した。"
