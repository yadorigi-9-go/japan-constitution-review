excerpt: "このことによって、私学助成が憲法違反と言われることがないようにするということと、それから、今後、公私問わず、教育についてはしっかりとした支援をするということを明確にする必要があるのではないかということでございます。"
summary: "自由民主党の下村博文衆議院議員が、2018年「条文イメージ(たたき台素案)」が第89条の「公の支配に属しない」という文言を「公の監督が及ばない」に改める狙いについて、私学助成が憲法違反と言われることがないようにすることと、公私を問わず教育への支援を明確にすることだと説明した。あわせて条文イメージはたたき台にすぎず、発議・国民投票を経る必要があると述べた。"
