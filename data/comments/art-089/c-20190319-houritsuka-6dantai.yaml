excerpt: "これまで現行の国による私学に対する監督権限で「公の支配」の要件を満たしていると考え、運営してきたのであり、改憲をいますぐかつ絶対に必要だというほどのものではありません。"
summary: "法律家6団体でつくる改憲問題対策法律家6団体連絡会が、自民党憲法改正推進本部のQ&Aを批判する資料の中で、89条の「公の支配に属しない」を「公の監督が及ばない」に改める案について、わかりやすくする意図は理解できるとしつつ、現行の監督権限で「公の支配」の要件を満たしているとして運営してきたので、今すぐ絶対に必要な改憲ではないとした。"
