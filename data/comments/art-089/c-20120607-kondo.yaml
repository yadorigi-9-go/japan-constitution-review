excerpt: "政教分離原則については、地方公共団体などによる地鎮祭への玉串料の支出など、ごく一般的な社会的儀礼、習俗的行為の範囲を超えないものについては、公共性のある行為として公費の支出が認められるべきと我が党は考えます。"
summary: "自由民主党の近藤三津枝衆議院議員が、地鎮祭への玉串料支出などの事例を挙げ、社会的儀礼・習俗的行為の範囲を超えない公金支出は認められるべきだと述べた。自民党2012年改憲草案第20条3項ただし書きの新設、およびそれを第89条で引用する形での公金支出禁止の範囲限定を支持する立場の発言。"
