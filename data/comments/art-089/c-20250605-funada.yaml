summary: "自由民主党の船田元衆議院議員が、89条の「公の支配に属しない」事業への公金支出禁止について、政府は私立学校が公の支配に属すると解釈して私学助成を行ってきたが、「支配」の一般的な語感とは異なり憲法と現実が乖離していると述べた。自民党が改憲4項目の中で89条を「公の監督が及ばない」に改める案を提案していると説明した。"
