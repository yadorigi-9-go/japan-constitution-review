excerpt: "現在、自民党が示す憲法改正たたき台案では憲法への自衛隊明記が盛り込まれていますが、現状維持のまま自衛隊の存在を記すだけでは、我が国の国防に関する課題が克服できないと考えます。"
summary: "参政党の和田政宗衆議院議員が、自民党の憲法改正たたき台案に盛り込まれた自衛隊明記について、現状維持のまま自衛隊の存在を記すだけでは国防に関する課題は克服できないと述べた。参政党としては、自衛のための軍隊(自衛軍)の保持を憲法草案で掲げていると説明した。"
