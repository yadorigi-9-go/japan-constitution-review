excerpt: "日本維新の会は、第九条第二項を残したまま自衛隊を加筆するだけでは、戦力不保持を定める規定と自衛隊の存在との関係が不明確なまま残ってしまうというふうに主張しております。"
summary: "日本維新の会の池畑浩太朗衆議院議員が、第9条第2項を維持したまま別の規定で自衛隊を明記する自民党の案について、戦力不保持の規定と自衛隊の存在との関係が不明確なまま残るとする党の主張を述べた。党としては第2項を削除し、自衛権の行使とその担い手を憲法上明確に位置づける方向性を示していると説明し、各会派の主張を比較した。"
