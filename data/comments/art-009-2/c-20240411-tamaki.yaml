excerpt: "九条の二を創設して自衛隊を明記する、いわゆる自衛隊明記論については、これは何度も申し上げていますが、違憲論を解消することのできない、法律的にはほとんど意味のないものであって、労多くして益なしの改憲案です。"
summary: "国民民主党の玉木雄一郎衆議院議員が、9条の2を新設して自衛隊を明記する自民党案について、違憲論を解消できず法律的な意味に乏しいと述べた。自衛隊が行使する自衛権の範囲を引き続き解釈に委ねる点を最大の課題として挙げ、自衛権を9条2項の例外として明確に位置づけるなどの議論が必要だとした。"
