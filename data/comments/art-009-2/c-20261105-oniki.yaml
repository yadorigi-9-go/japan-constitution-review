excerpt: "政府答弁に見たように、自衛隊を軍隊と呼ぶかどうかは定義次第であり、呼称の問題自体は本質的な事柄ではありません。"
summary: "自由民主党の鬼木誠衆議院議員が、平成30年の条文イメージで提案している第9条の2(国防規定の創設、自衛隊の明記、シビリアンコントロールの規定)を紹介したうえで、「自衛隊は軍隊か」に関する過去の政府答弁を整理した。自衛隊を軍隊と呼ぶかどうかは定義次第で本質的な事柄ではなく、憲法上の制約がある自衛隊が国と国民を守り切れるかという実質面が重要だと述べた。"
