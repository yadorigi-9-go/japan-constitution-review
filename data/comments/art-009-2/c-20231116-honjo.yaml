excerpt: "この「妨げず、」の条文が九条の二として現在の九条の後ろに置かれることになると、当該規定は九条の例外規定と解され、九条一項、二項が空文化するおそれがあります。"
summary: "立憲民主党・無所属の本庄知史衆議院議員が、2018年「条文イメージ(たたき台素案)」が新設する第9条の2の「妨げず」との文言が第9条の例外規定と解釈され、第9条1項・2項が実質的に空文化するおそれがあると批判した。自民党側はこれまでの政府解釈を変更しないと説明しているが、自衛隊を憲法に明記すること自体の必要性にも疑問を呈した。"
