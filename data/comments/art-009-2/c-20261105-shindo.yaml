excerpt: "私は、これにより、憲法の未完成部分を完成させ、いかなるときも国と国民を守り抜く国防体制が更に確固たるものになると考えております。"
summary: "自由民主党の新藤義孝衆議院議員が、2018年「条文イメージ(たたき台素案)」の第9条の2(国防規定の創設、自衛隊の明記、シビリアンコントロールの明記)の内容を紹介し、これにより憲法の未完成部分が完成し国防体制がより確固たるものになるとの考えを述べた。あわせて、自衛隊が軍隊かは軍隊の定義によるとする政府答弁と同じ立場に立つと述べた。"
