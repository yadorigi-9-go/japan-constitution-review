excerpt: "九条の二は、現行法の自衛隊の法的位置づけや必要最小限の自衛権行使の範囲において、これまでの解釈に全く変更を加えておらず、九条と九条の二は矛盾しない位置づけとしており、現行九条の例外を設けようとするものではありません。"
summary: "自由民主党の新藤義孝衆議院議員が、2018年「条文イメージ(たたき台素案)」が新設する第9条の2について、自衛隊の法的位置づけや必要最小限の自衛権行使の範囲に関するこれまでの政府解釈を変更するものではなく、第9条の例外を設けるものでもないと説明した。"
