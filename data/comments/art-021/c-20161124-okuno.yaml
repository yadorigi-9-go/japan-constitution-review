excerpt: "これはまさに日本国憲法の基本原理中の原理だと思うんですね。これに修正を加えるということは、私は、日本国憲法の改正限界、これを超えていると思います。"
summary: "民進党・無所属クラブの奥野総一郎衆議院議員が、自民党2012年改憲草案第21条2項が表現の自由に「公益及び公の秩序」による制約を新設する点を取り上げ、表現の自由などの精神的自由は憲法の基本原理中の基本原理であり、これに制約を加えることは憲法改正の限界を超えると主張した。"
