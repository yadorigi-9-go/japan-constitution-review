excerpt: "そのような事態に至らぬように、これらは総理大臣の専権事項として単独で決定できるよう、衆議院の解散は内閣総理大臣が決定するということを明文化すべきと考えております。"
summary: "自由民主党の岸信夫衆議院議員が、衆議院の解散決定権は現行第7条の中で解釈上読み込まれているに過ぎないとして、自民党2012年改憲草案第54条が新設する「衆議院の解散は、内閣総理大臣が決定する」との規定により、これを内閣総理大臣の権限として明文化すべきだと主張した。"
