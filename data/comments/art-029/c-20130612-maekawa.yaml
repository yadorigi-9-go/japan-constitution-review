excerpt: "営業の自由であろうが、財産権であろうが、表現の自由であろうが、何であろうが、全部公益、公の秩序によって、言わばお上によって制約されてしまうというのは、私は人権の歴史そのものをもう一度見直していただく必要があるのではないかと、そんなふうに考えます。"
summary: "民主党・新緑風会の前川清成参議院議員が、自民党の憲法改正草案が「公共の福祉」を「公益」「公の秩序」に書き換えていることに懸念を示した。現行憲法で「公共の福祉」が個別の人権規定に入っているのは第22条と第29条だけで、それは社会権の実現のために経済的自由への広い制約を認める必要があるためだと説明した。そのうえで、財産権を含むあらゆる人権が公益・公の秩序によって制約されることに反対した。"
