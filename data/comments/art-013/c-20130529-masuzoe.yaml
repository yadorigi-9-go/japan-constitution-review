excerpt: "私がかつて自民党にいたときに、自民党の第一次憲法草案はきちんと個人としてという文言をそのまま維持をいたしましたけれども、昨年発表されました第二次自民党の草案では、個人じゃなくて人としてというふうに変わっています。"
summary: "新党改革の舛添要一参議院議員(憲法審査会)が、参考人への質疑の中で、第13条の「個人として」という言葉は憲法学説・人権論の系譜から非常に重いとし、前年に発表された自民党の草案で「人として」に変わったことを挙げた。民法第2条の「個人の尊厳」との整合性にも触れ、「個人として」という言葉は守るべきで、「人として」と安易に変えるべきではないとの考えを述べた。"
