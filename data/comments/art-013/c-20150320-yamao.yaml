excerpt: "自民党の改憲草案の説明、ＱアンドＡの中には、いろいろな反論に対する弁解のようなものがあるんですけれども、この部分は全く説明がされていません。なぜ個を消すのかという理由は、このＱアンドＡでは全く触れられておりません。"
summary: "民主党・無所属クラブの山尾志桜里衆議院議員(法務委員会)が、法務大臣への質疑の中で、自民党の改憲草案のQ&Aには第13条の「個人」を「人」に変える理由の説明がないと指摘した。個人主義が強くなり過ぎたとの趣旨の発言をする関係者について、個人主義と利己主義を取り違えているのではないかとの考えを述べた。"
