excerpt: "つまり、この六十六条の二項というのは、やはり、戦前の日本社会、政治が軍部をコントロールできなくて、軍部によって支配されたという反省のもとにできた規定なんですよ、この六十六条の二項は。それを変えてしまった。"
summary: "民進党・無所属クラブの横路孝弘衆議院議員が、自民党2012年改憲草案第66条2項が国務大臣の要件を「文民」から「現役の軍人であってはならない」に改めている点を取り上げ、同項は戦前に政治が軍部を統制できず軍部に支配された反省から生まれた規定であるとして、これを変更することへの政府の見解を質した。"
