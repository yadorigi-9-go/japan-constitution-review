excerpt: "結局、九十五条で、自民党の憲法改正草案は、「地方自治体は、その事務を処理する権能を有し、法律の範囲内で条例を制定することができる。」と書いた上で、"
summary: "明治大学の大津浩教授が参考人として、自民党2012年改憲草案が現行第94条(地方公共団体の権能)を改番した第95条で「地方自治体は、その事務を処理する権能を有し、法律の範囲内で条例を制定することができる」としている点を取り上げ、条例が「法律の範囲内で」にとどまる基本は変えられていないと指摘した。草案全体が地方自治を「住民に身近な自主行政」に限定する意図が明確だとして、反対の立場を示した。"
