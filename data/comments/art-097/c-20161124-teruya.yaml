summary: "社会民主党の照屋寛徳衆議院議員が、自民党2012年改憲草案が現行第97条(基本的人権の永久性)を全面削除している点について、立憲主義および日本国憲法の三大原則の破壊であり、憲法改正の限界を超えるものだと批判した。"
