excerpt: "想定を超えた緊急事態に対応するため不可欠な立法措置については、国会による法律の制定を待てず即座に行う必要に迫られた場合において、内閣が超法規的措置により対応するよりも、憲法の規定に基づいて緊急政令を制定する方が"
summary: "自由民主党の田野瀬太道衆議院議員が、2018年の自民党「条文イメージ(たたき台素案)」に盛り込まれた緊急政令の制度(第73条の2)に言及し、大規模災害など国会による法律制定を待てない特別の事情がある場合に、内閣が超法規的措置で対応するよりも、憲法の規定に基づいて緊急政令を制定する仕組みを設ける方が望ましいと主張した。"
