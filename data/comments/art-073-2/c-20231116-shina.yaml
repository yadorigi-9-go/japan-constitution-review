excerpt: "我が党は、行政府に権力が集中することで国民の自由と民主政治を著しく損なう危険があるため、政府は、緊急政令、すなわち国会に代わって法律の効力を有する命令を発する必要はないという立場です。"
summary: "立憲民主党の階猛衆議院議員が、自民党の条文イメージでは議員任期延長と緊急政令の条項がセットになっていると指摘した。緊急事態下でも国会機能を維持できるのであれば必要な法律は制定できるとして、憲法41条の例外となる緊急政令の規定は必要ないのではないかと自民党側に質問した。"
