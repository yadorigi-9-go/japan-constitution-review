excerpt: "どうしても国会が開けないという究極の緊急事態に備えまして、国家としての統治機能を維持するため、内閣が一時的に法律や予算に代わる緊急政令を制定し緊急財政処分を行える制度を万々が一の備えとして用意しておくことが必要ではと提案をしております。"
summary: "自由民主党の新藤義孝衆議院議員(憲法審査会)が、選挙実施困難な事態の認定基準についての議論状況を説明した上で、国会を開けない究極の緊急事態に備え、内閣が法律・予算に代わる緊急政令・緊急財政処分を行える制度を「万々が一の備え」として用意する必要性を提案した。"
