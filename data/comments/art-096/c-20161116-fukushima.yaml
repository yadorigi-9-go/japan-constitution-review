excerpt: "初め、憲法九十六条、憲法改正の発議を三分の二、それを過半数にするという意見が出ました。すると、裏口入学であるという批判が出て、この九十六条を改憲するという案は今の段階では引っ込みました。"
summary: "希望の会(自由・社民)の福島みずほ参議院議員が、自民党「日本国憲法改正草案」が憲法改正の発議要件を各議院の総議員の三分の二から過半数に緩和しようとしたものの、本来改正すべき内容を議論せず入り口のハードルだけ下げる「裏口入学」だとの批判を受けて、その案を引っ込めた経緯を指摘し、同草案は極めて問題があると述べた。"
