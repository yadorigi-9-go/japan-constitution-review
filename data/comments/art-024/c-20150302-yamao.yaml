excerpt: "こういう背景の中で、自民党改憲草案のこの家族規定、「家族は、互いに助け合わなければならない。」というふうにわざわざ憲法に書き込むことに賛成でありますか。有村大臣にお尋ねします。"
summary: "民主党・無所属クラブの山尾志桜里衆議院議員が、自民党2012年改憲草案第24条が新設する「家族は、互いに助け合わなければならない」との家族規定について、これを憲法に書き込むことに賛成かどうかを有村治子国務大臣に質問した(大臣は政党の改憲案への回答は適切でないとして答弁を控えた)。"
