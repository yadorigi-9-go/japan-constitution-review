excerpt: "憲法二十四条一項に、家族は社会の自然かつ基礎的な単位であり、尊重される、家族は互いに助け合わなければならないとしています。公助ではなく自助の強調です。"
summary: "立憲民主・社民の福島みずほ参議院議員が、自民党2012年改憲草案第24条1項が新設する「家族は、互いに助け合わなければならない」との規定を引用し、国(公助)ではなく家族(自助)による支え合いを強調するものだと批判した。"
