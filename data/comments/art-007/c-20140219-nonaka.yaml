excerpt: "問題は、解散権は内閣総理大臣の絶対的専権事項だとほとんどの政治家が思い込み、信じ切っておることでございます。そのことが解散権を濫用させる原因となり、議院内閣制の適切な機能の障害になっておると思うのでございます。"
summary: "元内閣官房長官の野中廣務氏が参考人として、憲法第7条は内閣の助言と承認による天皇の国事行為として衆議院の解散を定めており、解散権を内閣総理大臣個人の専権事項とする規定はないと指摘した上で、解散権を総理の絶対的専権事項だと思い込む風潮が解散権の濫用を招き、議院内閣制の適切な機能を妨げていると述べた。"
