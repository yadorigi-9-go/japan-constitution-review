excerpt: "衆議院解散をテーマとして今日こうやって憲法審査会で議論しているわけですから、解散は総理の専権事項という表現は使うべきではないと思いますが、いかがでしょうか。"
summary: "立憲民主党の谷田川元衆議院議員が、「専権」とは思うままに権力をふるうことだと辞書的な意味を指摘した上で、衆議院解散(憲法第7条、内閣の助言と承認による天皇の国事行為)を「総理の専権事項」と表現すべきではないと、自民党・公明党の見解を求めた。"
