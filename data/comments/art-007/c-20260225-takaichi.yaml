excerpt: "衆議院の解散は憲法七条の規定において天皇の国事に関する行為とされておりますが、実質的に衆議院の解散を決定する権限を有するのは、天皇の国事行為に関する行為について助言と承認を行う職務を有する内閣であると承知しています。"
summary: "高市早苗内閣総理大臣が参議院本会議の答弁で、衆議院解散は憲法第7条上は天皇の国事行為だが、実質的な決定権は助言と承認を行う内閣にあるとの政府の理解を説明。続けて、解散の時期・理由について憲法上の制約はなく、内閣が政治的責任で判断するものとの考えを述べた。"
