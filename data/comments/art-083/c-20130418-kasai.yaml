excerpt: "国の財政を悪化させた原因というのは、憲法に財政健全化の規定がないからだという主張もございました。しかし、これは、歴代政権が行ってきた財政運営をみずから省みない、はっきり言って無責任な主張であって、私は問題のすりかえだということを言いたいと思います。"
summary: "日本共産党の笠井亮衆議院議員が、自民党2012年改憲草案第83条2項の新設(財政健全性規定)が提案された同じ憲法審査会で、国の財政悪化の原因を憲法に財政健全化規定がないことに求める主張は、歴代政権自身の財政運営を省みない無責任な主張であり問題のすりかえだと批判し、現行憲法第七章の規定に従った財政運営こそ必要だと主張した。"
