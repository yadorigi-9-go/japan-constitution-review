excerpt: "我が党の憲法改正草案では、八十三条二項を新設して、「財政の健全性は、法律の定めるところにより、確保されなければならない。」とし、財政の健全性を憲法上の価値として明記いたしました。"
summary: "自由民主党の伊藤達也衆議院議員が、自民党2012年改憲草案第83条2項の新設(財政の健全性を法律の定めるところにより確保しなければならないとする規定)を紹介し、財政の健全性を憲法上の価値として明記したと説明した。具体的な基準は財政健全化責任法のような法律で定める想定だとしている。"
