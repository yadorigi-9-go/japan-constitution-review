excerpt: "しかし、それがどの程度の地域的広がりを指すのか、広範な地域の具体的基準が法律に委ねられることで、法改正によって要件が実質的に緩和されるリスクはないのか、また、一体性だけで選挙権の行使を延期する憲法上の根拠として十分なのか、議論を深める必要があります。"
summary: "会派中道(公明党)の國重徹衆議院議員が、改憲ありきでも現状ありきでもないとの立場を示したうえで、前の国会で示された緊急事態条項のイメージ案のうち議員任期の延長について、選挙実施優先が大前提だと述べた。「広範な地域」の具体的基準を法律に委ねることで要件が実質的に緩和されるおそれはないかなど、広範性・長期性の要件の具体化・精緻化を議論すべきだと提案した。"
