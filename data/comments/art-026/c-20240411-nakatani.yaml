excerpt: "国は、各個人の経済的理由にかかわらず教育を受ける機会を確保できる教育環境の整備に努めなければならないとしております。"
summary: "自由民主党の中谷元衆議院議員が、自民党2018年「条文イメージ(たたき台素案)」が新設する教育環境整備の国の努力義務(第26条3項)を取り上げ、教育格差の是正を理由に、経済的理由にかかわらず教育を受ける機会を確保する責務を憲法に規定すべきだと主張した。"
