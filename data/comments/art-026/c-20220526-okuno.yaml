excerpt: "自民党の改正案では、教育環境の整備に努めなければならないとだけなっているので、努力義務にしかすぎないんですよね。本当にこの規定で予算が増えるのか、無償化になるかということは、必ずしも明らかではありません。"
summary: "立憲民主党の奥野総一郎衆議院議員が、自民党2018年「条文イメージ(たたき台素案)」が新設する教育環境整備の国の努力義務(第26条3項)について、努力義務にすぎず、この規定で予算が増えたり無償化が進むかは明らかでないと指摘し、教育予算の拡充は憲法改正を経ずに行うべきだと主張した。"
