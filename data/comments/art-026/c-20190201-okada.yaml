excerpt: "二十六条三項として、経済的理由にかかわらず教育を受ける機会の確保を含め、国が教育環境の整備に努めるべき旨の規定を追加しております。"
summary: "自由民主党の岡田直樹参議院議員が、代表質問で自民党2018年「条文イメージ(たたき台素案)」が新設する第26条3項(教育環境整備の国の努力義務)を紹介し、経済的理由にかかわらず教育を受ける機会の確保を含めて国が教育環境の整備に努めるべき旨の規定を追加したと説明した。"
