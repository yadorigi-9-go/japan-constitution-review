excerpt: "教育の目的は、一人ひとりの子どもたちの人格の完成のみにおかれるべきというのが、憲法の原理だ。自民党の改憲案は、『国民の教育権』ではなく、『国家の教育権』――国策のための教育という命題を入れてしまっている"
summary: "日本共産党の志位和夫委員長が記者会見で、自民党憲法改正推進本部が了承した教育分野の改憲案条文について、教育の目的に「国の未来を切り拓く上で極めて重要な役割を担う」と記載されていることを指摘した。教育の目的は子どもの人格の完成のみに置かれるべきだとして、国策のための教育という命題を入れるものだと批判した。"
