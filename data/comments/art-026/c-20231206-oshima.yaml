excerpt: "まず、教育の充実や少子化対策のために憲法改正が必要か否かについて、我が会派は、これらの施策は現行法の運用や改正で十分対応できるものであるため、憲法改正は不要と考えています。"
summary: "れいわ新選組の大島九州男参議院議員が、自民党が2018年に「教育充実」の改憲条文イメージを発表していることに触れたうえで、教育の充実や少子化対策は現行法の運用や改正で対応できるため、憲法改正は不要とする会派の意見を述べた。あわせて、大学院までの教育無償化や奨学金返済の免除などを主張した。"
