excerpt: "五十三条の改正であれば、つまり、四分の一の要求があれば臨時国会を二十日以内に開かなければいけないという、二〇一二年の自民党憲法改正草案にも入っていた期限を入れるということは、これはもし賛同いただけるんだったら、そこからでも始めたらどうかなと。"
summary: "国民民主党・無所属クラブの玉木雄一郎衆議院議員(憲法審査会)が、合意が得られるところから憲法改正を進めるべきとの議論の中で、2012年の自民党憲法改正草案にも入っていた臨時国会の召集期限(要求から20日以内)を第53条に入れる改正であれば、立憲民主党の賛同も得て、そこから始めてはどうかと述べた。"
