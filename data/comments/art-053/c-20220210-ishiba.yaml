excerpt: "自民党の憲法改正草案は、衆参いずれかの総議員の四分の一以上の要求があれば、二十日以内に召集、もちろん召集は陛下の権能であらせられるのだが、しなければならないというふうに書いてある。これに反対する党があるんだろうか。"
summary: "自由民主党の石破茂衆議院議員(憲法審査会)が、平成24年の自民党の憲法改正草案のうち、多くの党の賛成が得られると考えるものの一つとして、臨時国会の召集要求から20日以内の召集を義務づける規定を挙げた。少数意見を尊重するという考え方がその背景にあったとの考えを述べた。"
