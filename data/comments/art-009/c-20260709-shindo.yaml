excerpt: "私たちが提案する、憲法九条一項、二項はそのままに、九条の二として国防規定の創設、実力組織としての自衛隊の明記、シビリアンコントロールの規定、これを定める改正案は、憲法上の自衛隊の位置づけを変えることなく"
summary: "自民党憲法審査会の与党筆頭幹事である新藤義孝衆議院議員が、9条1項・2項を維持したまま9条の2を新設して自衛隊を明記する自民党の改正案について、憲法上の自衛隊の位置づけを変えずに国防に関する基本法体系を完成させるものだと説明した。"
