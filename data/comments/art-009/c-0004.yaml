excerpt: "二〇一二年の憲法改正草案では、まさに今の維新案とほぼ同じ、国防軍の創設と九条二項削除案ということだったのが、後に、まさに今議論されている自衛隊明記案に維新とは逆の方向で変わりました。その変わった理由について伺いたいと思います。"
summary: "国民民主党の玉木雄一郎衆議院議員が、自民党に対し、2012年の憲法改正草案(国防軍創設・9条2項削除案)から、当時議論されていた「自衛隊明記」案へ方針転換した理由を質問した。"
