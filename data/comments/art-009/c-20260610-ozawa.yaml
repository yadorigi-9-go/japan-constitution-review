excerpt: "自衛隊明記改憲論を唱える政党は、歴代政府の九条解釈は変更せず、憲法の平和主義は維持して、自衛隊を明記するだけと訴えていますが、武力行使を行う組織である自衛隊を憲法に明記すると、"
summary: "立憲民主党の小沢雅仁参議院議員が、自衛隊を憲法に明記しても歴代政府の9条解釈・平和主義は変わらないとする立場に対し、武力行使を行う組織を明記すれば9条1項の戦争放棄・2項の戦力不保持や前文の平和主義との関係に曖昧さや矛盾が生じ、9条の規範内容が変質する可能性があるのではないかと参考人に問いかけた。"
