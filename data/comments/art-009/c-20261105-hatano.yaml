excerpt: "この審査会では、憲法九条を変えて自衛隊を明記すべきだとか、国防軍として位置づけるべきだという主張がされています。しかし、そうした議論で一切触れられないのは、憲法と矛盾する米軍の存在です。"
summary: "日本共産党の畑野君枝衆議院議員が、国民が改憲を求めていない中で憲法審査会を動かすべきではないとの立場を述べた。9条を変えて自衛隊を明記する、国防軍として位置づけるといった主張がある一方で、憲法と矛盾する米軍の存在には触れられていないと指摘し、9条を生かす議論が必要だと述べた。"
