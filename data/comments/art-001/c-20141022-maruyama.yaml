excerpt: "第一条の天皇については、現行憲法では象徴と定義されておりますけれども、我が国の天皇制は既に国民から強く支持されておりますが、国際的に見ますと、やはり象徴というのは非常に分かりにくく、天皇が元首であるということを明記する必要があると考えております。"
summary: "自由民主党の丸山和也参議院議員(憲法審査会)が、自民党の日本国憲法改正草案の主要なポイントを説明する中で、第1条について、現行憲法の「象徴」という定義は国際的に見て分かりにくいとして、天皇が元首であることを明記する必要があるとの考えを述べた。"
