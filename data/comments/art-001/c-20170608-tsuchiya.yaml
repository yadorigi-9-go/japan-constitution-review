excerpt: "私は、元首というのはいささかというか相当抵抗があって、象徴ということの方が、より歴史上の存在、天皇の存在にふさわしいんだろうと思います。"
summary: "自由民主党の土屋正忠衆議院議員(憲法審査会)が、自民党の憲法改正草案では天皇を元首として位置づけたことに触れた上で、元首には相当抵抗があり、象徴の方が天皇の存在にふさわしいとの考えを述べた。芦田均の「新憲法解釈」の記述を引き、象徴から元首になるのは「格下げ」だとも述べた。"
