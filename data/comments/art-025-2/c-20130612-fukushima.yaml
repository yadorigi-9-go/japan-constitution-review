excerpt: "環境権については権利ではなく、国は、国民と協力して、国民が良好な環境を享受することができるようにその保全に努めなければならないとしております。責務としているわけですが、このことによってどの程度環境権が保障されるでしょうか。"
summary: "社会民主党・護憲連合の福島みずほ参議院議員が、自民党2012年改憲草案第25条の2が環境権を国民の権利としてではなく国の「責務」として規定している点を問題視し、この規定によってどの程度環境権が実質的に保障されるのか疑問を呈した。"
