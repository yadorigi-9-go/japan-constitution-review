excerpt: "ただいま樋口委員がおっしゃるような環境権の考え方については、私も憲法に盛り込むのにふさわしいものだと考えております。"
summary: "自由民主党の石原伸晃衆議院議員が、自民党2012年改憲草案に「国は、国民と協力して、国民が良好な環境を享受することができるようにその保全に努めなければならない」との環境保全規定(第25条の2)を盛り込んだことを説明し、環境権の考え方は憲法に盛り込むのにふさわしいとの考えを示した。"
