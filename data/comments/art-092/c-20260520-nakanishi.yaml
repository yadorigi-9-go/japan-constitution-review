excerpt: "地方公共団体は、基礎的な地方公共団体及びこれを包括する広域の地方公共団体とすることを基本とし、その種類並びに組織及び運営に関する事項は、地方自治の本旨に基づいて、法律でこれを定めるとの言及を考えているところです。"
summary: "自由民主党の中西祐介参議院議員が、現行憲法の地方自治規定が第八章のわずか4条にとどまっていることを指摘し、自民党2018年「条文イメージ(たたき台素案)」第92条の、市町村(基礎的な地方公共団体)と都道府県(広域の地方公共団体)の二層構造を憲法に明記する規定を紹介し、地方自治の基盤強化のために必要だと主張した。"
