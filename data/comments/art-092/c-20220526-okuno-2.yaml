excerpt: "自民党の四項目改憲案では二層制を明記していると思われますが、果たして、こう縛ることが必要でしょうか。地方公共団体の規模や運営能力に応じて、多様な組織形態を認めるべきであります。"
summary: "立憲民主党の奥野総一郎衆議院議員が、都道府県と市町村の二層制を明記する自民党の改憲4項目案について、そのように縛る必要があるかと疑問を示した。政令市を一層制とする特別市や道州制なども例に挙げ、地方公共団体の規模や運営能力に応じた多様な組織形態を認めるべきだと述べた。"
