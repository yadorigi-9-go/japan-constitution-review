excerpt: "国政上の行為に関する国民への説明の責務、それから環境保全の責務、それから犯罪被害者等への配慮につきましては、個人が法律上の権利として主張するところまでは内容が熟していないと考え、国側の責務として規定することとしております。"
summary: "自民党の中川雅治参議院議員が、2012年改憲草案で新設した「国政上の行為に関する国の説明責務」等の新しい人権的規定について、個人が法律上の権利として主張できる段階まで内容が熟していないため、国民の権利としてではなく国の責務として規定したと起草趣旨を説明した。"
