excerpt: "やはりこれを取り戻す。今、安倍内閣は、日本を取り戻す、これが一番の、最大の目的ですので、日本の伝統、皇室をいただく二千年の歴史のある日本の国柄を明確に出す必要があると思います。"
summary: "自由民主党の西川京子衆議院議員が、現行憲法前文は占領下で作られたものであるとして全面的に書き改めるべきだとし、日本の伝統・皇室・歴史に基づく国柄を前文に明確に示す必要があると主張した。改憲草案そのものへの明示的な言及はないが、前文を歴史・伝統中心の記述に変える方向性を支持する発言。"
