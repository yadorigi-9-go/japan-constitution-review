excerpt: "まずは、対象県における投票率の推移であります。導入時は高知県が最下位、そして、その後は徳島県が前回の選挙までずっと最下位となっています。"
summary: "国民民主党の飯泉嘉門衆議院議員が、優先して取り組むべき改憲項目として合区の解消と選挙困難時の議員任期延長を挙げた。合区については、導入時に結論を得るとされながら10年以上経過していること、対象県の投票率の低下や無効票の増加、対象県の増加の可能性を挙げ、早急な解消を求めた。"
