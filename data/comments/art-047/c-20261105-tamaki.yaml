excerpt: "緊急避難措置として導入されて十年が経過した合区制度は、対象県の投票率激減から見ても、国民の参政権に大きな支障を生じさせ、国民主権にも反しています。"
summary: "国民民主党の玉木雄一郎衆議院議員が、改憲項目を大規模災害時等の議員任期延長と参議院の合区解消の2項目に絞るべきだと述べた。合区制度は対象県の投票率の大幅な低下から見て参政権に大きな支障を生じさせ国民主権にも反するとし、選挙制度改正の周知期間を踏まえ、次の参議院選挙までの解消に向けて来年7月頃までをめどに実現すべきだと主張した。"
