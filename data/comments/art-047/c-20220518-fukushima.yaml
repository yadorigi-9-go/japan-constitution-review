excerpt: "ところが、この二〇一八年の自民党の憲法改正草案に関して言えば、四十七条の案ですが、両議院となっています。参議院の特殊性もへったくれもなく、衆議院もこれは対象にしているわけです。"
summary: "立憲民主・社民の福島みずほ参議院議員が、選挙制度は憲法ではなく公職選挙法で議論すべきテーマだと述べた。2018年の自民党案の47条について、参議院だけでなく衆議院も対象にしている点や、「人口を基本とし」とする点が投票価値の平等の考え方と矛盾しないかを問題にし、投票価値の平等に反する憲法の規定を設けるべきではないと主張した。"
