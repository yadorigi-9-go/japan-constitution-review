summary: "日本共産党の山添拓参議院議員が、自民党の2018年改憲草案が選挙区の画定基準に人口以外の要素を加えることについて、投票価値の平等を憲法上の要請から考慮要素の一つに格下げするものであり看過できないと批判し、都道府県単位の選挙区は憲法上の要請ではないとして現行制度の見直しを主張した。"
