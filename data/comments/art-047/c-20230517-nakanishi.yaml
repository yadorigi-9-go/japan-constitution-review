excerpt: "第四十七条一項には、両議院の議員の選挙について、選挙区を設けるときは、人口を基本とし、行政区画、地域的な一体性、地勢等を総合的に判断して、選挙区及び各選挙区において選挙すべき議員の数を定めるものとする"
summary: "自由民主党の中西祐介参議院議員が、参議院の合区問題の解消を急ぐべきだとして、自民党の憲法改正に関する条文イメージ(たたき台素案、2018年公表)第47条1項を紹介し、選挙区の画定基準に人口以外の要素(行政区画、地域的一体性、地勢等)を憲法に明記すべきだと主張した。ノルウェー憲法の面積要素などの例も挙げている。"
