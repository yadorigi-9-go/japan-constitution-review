excerpt: "国民の憲法尊重義務を入れるというのは、私は、近代立憲主義をとり、そして民主主義を大事にする日本の憲法としてはふさわしくないと考えますが、いかがですか。"
summary: "民主党・無所属クラブの辻元清美衆議院議員が、自民党2012年改憲草案第102条が新設する「全て国民は、この憲法を尊重しなければならない」との国民の憲法尊重義務について、憲法は国家権力を縛るものだとする近代立憲主義の考え方にふさわしくないと批判し、大臣の見解を質した。"
