excerpt: "立憲主義を根拠として一文字たりとも譲ってはいけないのだということであれば、立憲主義というものの歴史的な経過に学んでいない、思考停止としか言いようがないわけでありまして、そのような議論は成立しないと私は考えております。"
summary: "自由民主党の宮崎政久衆議院議員が、草案第102条の国民の憲法尊重義務などの新設規定を取り上げた上で、立憲主義を根拠に一字一句の改正も認めないとする立場は、立憲主義の歴史的な経過を学んでいない思考停止だと反論し、時代の進展に応じた新たな規定として擁護した。"
