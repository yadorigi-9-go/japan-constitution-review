id: art-073-2
title: "大規模災害時の緊急政令制定権を内閣に新設(第73条の次に追加)"
is_new: true
renamed_from: null
chapter: 第五章
number: 73
paragraphs:
  - no: 1
    based_on: null
    text: "大地震その他の異常かつ大規模な災害により、国会による法律の制定を待ついとまがないと認める特別の事情があるときは、内閣は、法律で定めるところにより、国民の生命、身体及び財産を保護するため、政令を制定することができる。"
  - no: 2
    based_on: null
    text: "内閣は、前項の政令を制定したときは、法律で定めるところにより、速やかに国会の承認を求めなければならない。"
