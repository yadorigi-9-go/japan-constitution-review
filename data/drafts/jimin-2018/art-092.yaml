number: 92
paragraphs:
  - no: 1
    based_on: 1
    text: "地方公共団体は、基礎的な地方公共団体及びこれを包括する広域の地方公共団体とすることを基本とし、その種類並びに組織及び運営に関する事項は、地方自治の本旨に基づいて、法律でこれを定める。"
