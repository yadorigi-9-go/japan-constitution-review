chapter: 第七章
number: 89
paragraphs:
  - no: 1
    based_on: 1
    text: "公金その他の公の財産は、宗教上の組織若しくは団体の使用、便益若しくは維持のため、又は公の監督が及ばない慈善、教育若しくは博愛の事業に対し、これを支出し、又はその利用に供してはならない。"
