id: art-009-2
title: "自衛隊の保持と国会の統制を明記(第9条を維持した上で新設)"
is_new: true
renamed_from: null
chapter: 第二章
number: 9
paragraphs:
  - no: 1
    based_on: null
    text: "前条の規定は、我が国の平和と独立を守り、国及び国民の安全を保つために必要な自衛の措置をとることを妨げず、そのための実力組織として、法律の定めるところにより、内閣の首長たる内閣総理大臣を最高の指揮監督者とする自衛隊を保持する。"
  - no: 2
    based_on: null
    text: "自衛隊の行動は、法律の定めるところにより、国会の承認その他の統制に服する。"
source_url: "https://storage2.jimin.jp/pdf/constitution/news/20180326_01.pdf"
