id: art-026
title: "教育環境整備に関する国の努力義務を新設(3項として追加)"
is_new: false
renamed_from: null
chapter: 第三章
number: 26
paragraphs:
  - no: 1
    based_on: 1
    text: "すべて国民は、法律の定めるところにより、その能力に応じて、ひとしく教育を受ける権利を有する。"
  - no: 2
    based_on: 2
    text: "すべて国民は、法律の定めるところにより、その保護する子女に普通教育を受けさせる義務を負ふ。義務教育は、これを無償とする。"
  - no: 3
    based_on: null
    text: "国は、教育が国民一人一人の人格の完成を目指し、その幸福の追求に欠くことのできないものであり、かつ、国の未来を切り拓く上で極めて重要な役割を担うものであることに鑑み、各個人の経済的理由にかかわらず教育を受ける機会を確保することを含め、教育環境の整備に努めなければならない。"
source_url: "https://storage2.jimin.jp/pdf/constitution/news/20180326_01.pdf"
retrieved_at: 2026-11-01
