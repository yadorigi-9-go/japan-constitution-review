id: art-047
title: "選挙区の画定基準(人口・行政区画等)と参議院の合区解消の規定を追加"
is_new: false
renamed_from: null
chapter: 第四章
number: 47
paragraphs:
  - no: 1
    based_on: null
    text: "両議院の議員の選挙について、選挙区を設けるときは、人口を基本とし、行政区画、地域的な一体性、地勢等を総合的に勘案して、選挙区及び各選挙区において選挙すべき議員の数を定めるものとする。参議院議員の全部又は一部の選挙について、広域の地方公共団体のそれぞれの区域を選挙区とする場合には、改選ごとに各選挙区において少なくとも一人を選挙すべきものとすることができる。"
  - no: 2
    based_on: 1
    text: "前項に定めるもののほか、選挙区、投票の方法その他両議院の議員の選挙に関する事項は、法律でこれを定める。"
source_url: "https://storage2.jimin.jp/pdf/constitution/news/20180326_01.pdf"
retrieved_at: 2026-11-01
