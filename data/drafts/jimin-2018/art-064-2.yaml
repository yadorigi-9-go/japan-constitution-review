id: art-064-2
title: "選挙実施困難時の国会議員の任期特例を新設(国会の章の末尾に追加)"
is_new: true
renamed_from: null
chapter: 第四章
number: 64
paragraphs:
  - no: 1
    based_on: null
    text: "大地震その他の異常かつ大規模な災害により、衆議院議員の総選挙又は参議院議員の通常選挙の適正な実施が困難であると認めるときは、国会は、法律で定めるところにより、各議院の出席議員の三分の二以上の多数で、その任期の特例を定めることができる。"
