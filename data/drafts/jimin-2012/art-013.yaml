id: art-013
title: "「個人として尊重」を「人として尊重」に、「公共の福祉」を「公益及び公の秩序」に変更"
is_new: false
renamed_from: null
chapter: 第三章
number: 13
paragraphs:
  - no: 1
    text: "全て国民は、人として尊重される。生命、自由及び幸福追求に対する国民の権利については、公益及び公の秩序に反しない限り、立法その他の国政の上で、最大限に尊重されなければならない。"
