id: art-044
title: "「障害の有無」を差別禁止事由に追加"
is_new: false
renamed_from: null
chapter: 第四章
number: 44
paragraphs:
  - no: 1
    text: "両議院の議員及びその選挙人の資格は、法律で定める。この場合においては、人種、信条、性別、障害の有無、社会的身分、門地、教育、財産又は収入によって差別してはならない。"
