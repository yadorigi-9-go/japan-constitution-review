id: art-015
title: "公務員選定・罷免権の文言を変更、選挙に「日本国籍を有する」との要件を新設"
is_new: false
renamed_from: null
chapter: 第三章
number: 15
paragraphs:
  - no: 1
    text: "公務員を選定し、及び罷免することは、主権の存する国民の権利である。"
  - no: 2
    text: "全て公務員は、全体の奉仕者であって、一部の奉仕者ではない。"
  - no: 3
    text: "公務員の選定を選挙により行う場合は、日本国籍を有する成年者による普通選挙の方法による。"
  - no: 4
    text: "選挙における投票の秘密は、侵されない。選挙人は、その選択に関し、公的にも私的にも責任を問われない。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
