id: art-093
title: "地方自治体を基礎地方自治体・広域地方自治体の2層制とする規定を新設"
is_new: true
renamed_from: null
chapter: 第八章
number: 93
paragraphs:
  - no: 1
    based_on: null
    text: "地方自治体は、基礎地方自治体及びこれを包括する広域地方自治体とすることを基本とし、その種類は、法律で定める。"
  - no: 2
    based_on: null
    text: "地方自治体の組織及び運営に関する基本的事項は、地方自治の本旨に基づいて、法律で定める。"
  - no: 3
    based_on: null
    text: "国及び地方自治体は、法律の定める役割分担を踏まえ、協力しなければならない。地方自治体は、相互に協力しなければならない。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
