id: art-014
title: "「障害の有無」を差別禁止事由に追加、栄典授与が「いかなる特権も伴わない」との規定を削除"
is_new: false
renamed_from: null
chapter: 第三章
number: 14
paragraphs:
  - no: 1
    text: "全て国民は、法の下に平等であって、人種、信条、性別、障害の有無、社会的身分又は門地により、政治的、経済的又は社会的関係において、差別されない。"
  - no: 2
    text: "華族その他の貴族の制度は、認めない。"
  - no: 3
    text: "栄誉、勲章その他の栄典の授与は、現にこれを有し、又は将来これを受ける者の一代に限り、その効力を有する。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
