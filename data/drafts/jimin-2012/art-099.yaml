id: art-099
title: "緊急事態条項の新設(宣言の効果、政令制定権等)"
is_new: true
renamed_from: null
chapter: 第九章
number: 99
paragraphs:
  - no: 1
    text: "緊急事態の宣言が発せられたときは、法律の定めるところにより、内閣は法律と同一の効力を有する政令を制定することができるほか、内閣総理大臣は財政上必要な支出その他の処分を行い、地方自治体の長に対して必要な指示をすることができる。"
  - no: 2
    text: "前項の政令の制定及び処分については、法律の定めるところにより、事後に国会の承認を得なければならない。"
  - no: 3
    text: "緊急事態の宣言が発せられた場合には、何人も、法律の定めるところにより、当該宣言に係る事態において国民の生命、身体及び財産を守るために行われる措置に関して発せられる国その他公の機関の指示に従わなければならない。この場合においても、第十四条、第十八条、第十九条、第二十一条その他の基本的人権に関する規定は、最大限に尊重されなければならない。"
  - no: 4
    text: "緊急事態の宣言が発せられた場合においては、法律の定めるところにより、その宣言が効力を有する期間、衆議院は解散されないものとし、両議院の議員の任期及びその選挙期日の特例を設けることができる。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
