id: art-096
title: "地方自治体の財政について、自主財源の原則と国の財政措置を新設"
is_new: true
renamed_from: null
chapter: 第八章
number: 96
paragraphs:
  - no: 1
    based_on: null
    text: "地方自治体の経費は、条例の定めるところにより課する地方税その他の自主的な財源をもって充てることを基本とする。"
  - no: 2
    based_on: null
    text: "国は、地方自治体において、前項の自主的な財源だけでは地方自治体の行うべき役務の提供ができないときは、法律の定めるところにより、必要な財政上の措置を講じなければならない。"
  - no: 3
    based_on: null
    text: "第八十三条第二項の規定は、地方自治について準用する。"
