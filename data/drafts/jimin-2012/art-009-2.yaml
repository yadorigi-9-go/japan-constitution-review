id: art-009-2
title: "国防軍の新設"
is_new: true
renamed_from: null
chapter: 第二章
number: 9
paragraphs:
  - no: 1
    text: "我が国の平和と独立並びに国及び国民の安全を確保するため、内閣総理大臣を最高指揮官とする国防軍を保持する。"
  - no: 2
    text: "国防軍は、前項の規定による任務を遂行する際は、法律の定めるところにより、国会の承認その他の統制に服する。"
  - no: 3
    text: "国防軍は、第一項に規定する任務を遂行するための活動のほか、法律の定めるところにより、国際社会の平和と安全を確保するために国際的に協調して行われる活動及び公の秩序を維持し、又は国民の生命若しくは自由を守るための活動を行うことができる。"
  - no: 4
    text: "前二項に定めるもののほか、国防軍の組織、統制及び機密の保持に関する事項は、法律で定める。"
  - no: 5
    text: "国防軍に属する軍人その他の公務員がその職務の実施に伴う罪又は国防軍の機密に関する罪を犯した場合の裁判を行うため、法律の定めるところにより、国防軍に審判所を置く。この場合においては、被告人が裁判所へ上訴する権利は、保障されなければならない。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
