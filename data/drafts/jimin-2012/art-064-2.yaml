id: art-064-2
title: "政党に関する規定を新設"
is_new: true
renamed_from: null
chapter: 第四章
number: 64
paragraphs:
  - no: 1
    based_on: null
    text: "国は、政党が議会制民主主義に不可欠の存在であることに鑑み、その活動の公正の確保及びその健全な発展に努めなければならない。"
  - no: 2
    based_on: null
    text: "政党の政治活動の自由は、保障する。"
  - no: 3
    based_on: null
    text: "前二項に定めるもののほか、政党に関する事項は、法律で定める。"
