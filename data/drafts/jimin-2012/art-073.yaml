id: art-073
title: "政令の制定根拠を「憲法及び法律の実施」から「法律の規定」に変更し、委任のない政令の限界を「罰則」から「義務・権利制限」に拡大"
is_new: false
renamed_from: null
chapter: 第五章
number: 73
paragraphs:
  - no: 1
    text: "内閣は、他の一般行政事務のほか、次に掲げる事務を行う。一法律を誠実に執行し、国務を総理すること。二外交関係を処理すること。三条約を締結すること。ただし、事前に、やむを得ない場合は事後に、国会の承認を経ることを必要とする。四法律の定める基準に従い、国の公務員に関する事務をつかさどること。五予算案及び法律案を作成して国会に提出すること。六法律の規定に基づき、政令を制定すること。ただし、政令には、特にその法律の委任がある場合を除いては、義務を課し、又は権利を制限する規定を設けることができない。七大赦、特赦、減刑、刑の執行の免除及び復権を決定すること。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
