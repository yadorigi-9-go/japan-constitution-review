id: art-092
title: "地方自治の本旨として、住民参画と役務提供の公平な享受・負担を明記"
is_new: true
renamed_from: null
chapter: 第八章
number: 92
paragraphs:
  - no: 1
    based_on: null
    text: "地方自治は、住民の参画を基本とし、住民に身近な行政を自主的、自立的かつ総合的に実施することを旨として行う。"
  - no: 2
    based_on: null
    text: "住民は、その属する地方自治体の役務の提供を等しく受ける権利を有し、その負担を公平に分担する義務を負う。"
