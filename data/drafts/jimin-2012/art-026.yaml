id: art-026
title: "教育環境の整備に努める国の義務を新設"
is_new: false
renamed_from: null
chapter: 第三章
number: 26
paragraphs:
  - no: 1
    text: "全て国民は、法律の定めるところにより、その能力に応じて、等しく教育を受ける権利を有する。"
  - no: 2
    text: "全て国民は、法律の定めるところにより、その保護する子に普通教育を受けさせる義務を負う。義務教育は、無償とする。"
  - no: 3
    based_on: null
    text: "国は、教育が国の未来を切り拓く上で欠くことのできないものであることに鑑み、教育環境の整備に努めなければならない。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
