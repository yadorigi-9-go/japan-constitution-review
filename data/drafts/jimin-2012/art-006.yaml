id: art-006
title: "天皇の国事行為・公的行為を新設し、現行第3条・第4条2項・第6条・第7条の内容を統合(「助言と承認」を「進言」に変更)"
is_new: true
renamed_from: null
chapter: 第一章
number: 6
paragraphs:
  - no: 1
    based_on: null
    text: "天皇は、国民のために、国会の指名に基づいて内閣総理大臣を任命し、内閣の指名に基づいて最高裁判所の長である裁判官を任命する。"
  - no: 2
    based_on: null
    text: "天皇は、国民のために、次に掲げる国事に関する行為を行う。一憲法改正、法律、政令及び条約を公布すること。二国会を召集すること。三衆議院を解散すること。四衆議院議員の総選挙及び参議院議員の通常選挙の施行を公示すること。五国務大臣及び法律の定めるその他の国の公務員の任免を認証すること。六大赦、特赦、減刑、刑の執行の免除及び復権を認証すること。七栄典を授与すること。八全権委任状並びに大使及び公使の信任状並びに批准書及び法律の定めるその他の外交文書を認証すること。九外国の大使及び公使を接受すること。十儀式を行うこと。"
  - no: 3
    based_on: null
    text: "天皇は、法律の定めるところにより、前二項の行為を委任することができる。"
  - no: 4
    based_on: null
    text: "天皇の国事に関する全ての行為には、内閣の進言を必要とし、内閣がその責任を負う。ただし、衆議院の解散については、内閣総理大臣の進言による。"
  - no: 5
    based_on: null
    text: "第一項及び第二項に掲げるもののほか、天皇は、国又は地方自治体その他の公共団体が主催する式典への出席その他の公的な行為を行う。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
