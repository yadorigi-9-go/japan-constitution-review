id: art-034
title: "抑留・拘禁の手続保障を2項に分割・再構成"
is_new: false
renamed_from: null
chapter: 第三章
number: 34
paragraphs:
  - no: 1
    based_on: 1
    text: "何人も、正当な理由がなく、若しくは理由を直ちに告げられることなく、又は直ちに弁護人に依頼する権利を与えられることなく、抑留され、又は拘禁されない。"
  - no: 2
    based_on: 1
    text: "拘禁された者は、拘禁の理由を直ちに本人及びその弁護人の出席する公開の法廷で示すことを求める権利を有する。"
