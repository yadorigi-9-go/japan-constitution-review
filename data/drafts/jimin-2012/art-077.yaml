id: art-077
title: "最高裁判所規則に従う義務の対象を検察官から弁護士等にも拡大"
is_new: false
renamed_from: null
chapter: 第六章
number: 77
paragraphs:
  - no: 1
    text: "最高裁判所は、裁判に関する手続、弁護士、裁判所の内部規律及び司法事務処理に関する事項について、規則を定める権限を有する。"
  - no: 2
    text: "検察官、弁護士その他の裁判に関わる者は、最高裁判所の定める規則に従わなければならない。"
  - no: 3
    text: "最高裁判所は、下級裁判所に関する規則を定める権限を、下級裁判所に委任することができる。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
