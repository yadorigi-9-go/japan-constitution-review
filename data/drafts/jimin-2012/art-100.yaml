id: art-100
title: "改正の発議要件を緩和(各議院の総議員の3分の2以上→両議院の総議員の過半数)"
is_new: false
renamed_from: art-096
chapter: 第十章
number: 100
paragraphs:
  - no: 1
    text: "この憲法の改正は、衆議院又は参議院の議員の発議により、両議院のそれぞれの総議員の過半数の賛成で国会が議決し、国民に提案してその承認を得なければならない。この承認には、法律の定めるところにより行われる国民の投票において有効投票の過半数の賛成を必要とする。"
  - no: 2
    text: "憲法改正について前項の承認を経たときは、天皇は、直ちに憲法改正を公布する。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
