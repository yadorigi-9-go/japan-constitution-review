id: art-094
title: "地方自治体の議会・公務員の直接選挙権者を「日本国籍を有する者」に限定(第93条から改番)"
is_new: false
renamed_from: art-093
chapter: 第八章
number: 94
paragraphs:
  - no: 1
    text: "地方自治体には、法律の定めるところにより、条例その他重要事項を議決する機関として、議会を設置する。"
  - no: 2
    text: "地方自治体の長、議会の議員及び法律の定めるその他の公務員は、当該地方自治体の住民であって日本国籍を有する者が直接選挙する。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
