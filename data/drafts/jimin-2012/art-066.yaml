id: art-066
title: "国務大臣の要件を「文民」から「現役の軍人であってはならない」に変更"
is_new: false
renamed_from: null
chapter: 第五章
number: 66
paragraphs:
  - no: 1
    text: "内閣は、法律の定めるところにより、その首長である内閣総理大臣及びその他の国務大臣で構成する。"
  - no: 2
    text: "内閣総理大臣及び全ての国務大臣は、現役の軍人であってはならない。"
  - no: 3
    text: "内閣は、行政権の行使について、国会に対し連帯して責任を負う。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
