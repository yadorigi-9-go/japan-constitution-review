id: art-009
title: "戦力不保持規定の削除、自衛権の明記"
renamed_from: null
chapter: 第二章
number: 9
paragraphs:
  - no: 1
    text: "日本国民は、正義と秩序を基調とする国際平和を誠実に希求し、国権の発動としての戦争を放棄し、武力による威嚇及び武力の行使は、国際紛争を解決する手段としては用いない。"
  - no: 2
    text: "前項の規定は、自衛権の発動を妨げるものではない。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
