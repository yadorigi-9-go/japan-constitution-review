id: art-012
title: "国民の責務に「責任及び義務」の自覚を追加、「公共の福祉」を「公益及び公の秩序」に変更"
is_new: false
renamed_from: null
chapter: 第三章
number: 12
paragraphs:
  - no: 1
    text: "この憲法が国民に保障する自由及び権利は、国民の不断の努力により、保持されなければならない。国民は、これを濫用してはならず、自由及び権利には責任及び義務が伴うことを自覚し、常に公益及び公の秩序に反してはならない。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
