id: preamble
title: "前文を全面的に書き改め(国民主権・平和主義等の理念の明記から、歴史・伝統・国柄の記述を中心とする構成に変更)"
is_new: false
renamed_from: null
paragraphs:
  - no: 1
    based_on: null
    text: "日本国は、長い歴史と固有の文化を持ち、国民統合の象徴である天皇を戴く国家であって、国民主権の下、立法、行政及び司法の三権分立に基づいて統治される。"
  - no: 2
    based_on: null
    text: "我が国は、先の大戦による荒廃や幾多の大災害を乗り越えて発展し、今や国際社会において重要な地位を占めており、平和主義の下、諸外国との友好関係を増進し、世界の平和と繁栄に貢献する。"
  - no: 3
    based_on: null
    text: "日本国民は、国と郷土を誇りと気概を持って自ら守り、基本的人権を尊重するとともに、和を尊び、家族や社会全体が互いに助け合って国家を形成する。"
  - no: 4
    based_on: null
    text: "我々は、自由と規律を重んじ、美しい国土と自然環境を守りつつ、教育や科学技術を振興し、活力ある経済活動を通じて国を成長させる。"
  - no: 5
    based_on: null
    text: "日本国民は、良き伝統と我々の国家を末永く子孫に継承するため、ここに、この憲法を制定する。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
