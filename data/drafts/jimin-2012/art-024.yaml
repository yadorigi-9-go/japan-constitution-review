id: art-024
title: "「家族の助け合い」条項を新設"
is_new: false
renamed_from: null
chapter: 第三章
number: 24
paragraphs:
  - no: 1
    text: "家族は、社会の自然かつ基礎的な単位として、尊重される。家族は、互いに助け合わなければならない。"
  - no: 2
    text: "婚姻は、両性の合意に基づいて成立し、夫婦が同等の権利を有することを基本として、相互の協力により、維持されなければならない。"
  - no: 3
    text: "家族、扶養、後見、婚姻及び離婚、財産権、相続並びに親族に関するその他の事項に関しては、法律は、個人の尊厳と両性の本質的平等に立脚して、制定されなければならない。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
