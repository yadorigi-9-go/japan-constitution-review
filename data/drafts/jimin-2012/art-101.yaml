id: art-101
title: "憲法の最高法規性等(現行第98条から改番、内容面の変更はなし)"
is_new: false
renamed_from: art-098
chapter: 第十一章
number: 101
paragraphs:
  - no: 1
    text: "この憲法は、国の最高法規であって、その条規に反する法律、命令、詔勅及び国務に関するその他の行為の全部又は一部は、その効力を有しない。"
  - no: 2
    text: "日本国が締結した条約及び確立された国際法規は、これを誠実に遵守することを必要とする。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
