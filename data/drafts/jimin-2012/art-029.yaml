id: art-029
title: "財産権の制限根拠を「公共の福祉」から「公益及び公の秩序」に変更、知的財産権への配慮を追加"
is_new: false
renamed_from: null
chapter: 第三章
number: 29
paragraphs:
  - no: 1
    text: "財産権は、保障する。"
  - no: 2
    text: "財産権の内容は、公益及び公の秩序に適合するように、法律で定める。この場合において、知的財産権については、国民の知的創造力の向上に資するように配慮しなければならない。"
  - no: 3
    text: "私有財産は、正当な補償の下に、公共のために用いることができる。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
