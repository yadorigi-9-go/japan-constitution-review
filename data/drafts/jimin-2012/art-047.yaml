id: art-047
title: "選挙区の画定に「人口を基本とし、行政区画、地勢等を総合的に勘案」する基準を追加"
is_new: false
renamed_from: null
chapter: 第四章
number: 47
paragraphs:
  - no: 1
    text: "選挙区、投票の方法その他両議院の議員の選挙に関する事項は、法律で定める。この場合においては、各選挙区は、人口を基本とし、行政区画、地勢等を総合的に勘案して定めなければならない。"
