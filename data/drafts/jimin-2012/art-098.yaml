id: art-098
title: "緊急事態条項の新設(緊急事態の宣言)"
is_new: true
renamed_from: null
chapter: 第九章
number: 98
paragraphs:
  - no: 1
    text: "内閣総理大臣は、我が国に対する外部からの武力攻撃、内乱等による社会秩序の混乱、地震等による大規模な自然災害その他の法律で定める緊急事態において、特に必要があると認めるときは、法律の定めるところにより、閣議にかけて、緊急事態の宣言を発することができる。"
  - no: 2
    text: "緊急事態の宣言は、法律の定めるところにより、事前又は事後に国会の承認を得なければならない。"
  - no: 3
    text: "内閣総理大臣は、前項の場合において不承認の議決があったとき、国会が緊急事態の宣言を解除すべき旨を議決したとき、又は事態の推移により当該宣言を継続する必要がないと認めるときは、法律の定めるところにより、閣議にかけて、当該宣言を速やかに解除しなければならない。また、百日を超えて緊急事態の宣言を継続しようとするときは、百日を超えるごとに、事前に国会の承認を得なければならない。"
  - no: 4
    text: "第二項及び前項後段の国会の承認については、第六十条第二項の規定を準用する。この場合において、同項中「三十日以内」とあるのは、「五日以内」と読み替えるものとする。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
