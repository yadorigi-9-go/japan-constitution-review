id: art-070
title: "内閣総理大臣の職務代行規定を新設"
is_new: false
renamed_from: null
chapter: 第五章
number: 70
paragraphs:
  - no: 1
    text: "内閣総理大臣が欠けたとき、又は衆議院議員の総選挙の後に初めて国会の召集があったときは、内閣は、総辞職をしなければならない。"
  - no: 2
    based_on: null
    text: "内閣総理大臣が欠けたとき、その他これに準ずる場合として法律で定めるときは、内閣総理大臣があらかじめ指定した国務大臣が、臨時に、その職務を行う。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
