id: art-038
title: "自白のみによる場合の規定から「又は刑罰を科せられない」を削除"
is_new: false
renamed_from: null
chapter: 第三章
number: 38
paragraphs:
  - no: 1
    text: "何人も、自己に不利益な供述を強要されない。"
  - no: 2
    text: "拷問、脅迫その他の強制による自白又は不当に長く抑留され、若しくは拘禁された後の自白は、証拠とすることができない。"
  - no: 3
    text: "何人も、自己に不利益な唯一の証拠が本人の自白である場合には、有罪とされない。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
