id: art-018
title: "身体拘束からの自由の文言を整理し、拘束禁止と苦役禁止を2項に分離"
is_new: false
renamed_from: null
chapter: 第三章
number: 18
paragraphs:
  - no: 1
    text: "何人も、その意に反すると否とにかかわらず、社会的又は経済的関係において身体を拘束されない。"
  - no: 2
    text: "何人も、犯罪による処罰の場合を除いては、その意に反する苦役に服させられない。"
