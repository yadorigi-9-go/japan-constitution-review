id: art-097
title: "地方自治特別法の住民投票要件の文言を整理(第95条から改番)"
is_new: false
renamed_from: art-095
chapter: 第八章
number: 97
paragraphs:
  - no: 1
    text: "特定の地方自治体の組織、運営若しくは権能について他の地方自治体と異なる定めをし、又は特定の地方自治体の住民にのみ義務を課し、権利を制限する特別法は、法律の定めるところにより、その地方自治体の住民の投票において有効投票の過半数の同意を得なければ、制定することができない。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
