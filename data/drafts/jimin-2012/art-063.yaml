id: art-063
title: "答弁・説明のため求められた場合の議院出席義務に「職務上特に必要がある場合」の例外を新設"
is_new: false
renamed_from: null
chapter: 第四章
number: 63
paragraphs:
  - no: 1
    based_on: 1
    text: "内閣総理大臣及びその他の国務大臣は、議案について発言するため両議院に出席することができる。"
  - no: 2
    based_on: 1
    text: "内閣総理大臣及びその他の国務大臣は、答弁又は説明のため議院から出席を求められたときは、出席しなければならない。ただし、職務の遂行上特に必要がある場合は、この限りでない。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
