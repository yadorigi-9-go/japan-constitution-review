id: art-079
title: "国民審査の実施時期を法律に委任(現4項は削除)、報酬減額の例外を新設"
is_new: false
renamed_from: null
chapter: 第六章
number: 79
paragraphs:
  - no: 1
    based_on: 1
    text: "最高裁判所は、その長である裁判官及び法律の定める員数のその他の裁判官で構成し、最高裁判所の長である裁判官以外の裁判官は、内閣が任命する。"
  - no: 2
    based_on: 2
    text: "最高裁判所の裁判官は、その任命後、法律の定めるところにより、国民の審査を受けなければならない。"
  - no: 3
    based_on: 3
    text: "前項の審査において罷免すべきとされた裁判官は、罷免される。"
  - no: 4
    based_on: 5
    text: "最高裁判所の裁判官は、法律の定める年齢に達した時に退官する。"
  - no: 5
    based_on: 6
    text: "最高裁判所の裁判官は、全て定期に相当額の報酬を受ける。この報酬は、在任中、分限又は懲戒による場合及び一般の公務員の例による場合を除き、減額できない。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
