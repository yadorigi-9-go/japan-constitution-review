id: art-089
title: "宗教団体への公金支出禁止の範囲を限定し第20条の例外を新設、慈善・教育事業への支出禁止の要件を「公の支配」から「監督」に変更"
is_new: false
renamed_from: null
chapter: 第七章
number: 89
paragraphs:
  - no: 1
    based_on: 1
    text: "公金その他の公の財産は、第二十条第三項ただし書に規定する場合を除き、宗教的活動を行う組織若しくは団体の使用、便益若しくは維持のため支出し、又はその利用に供してはならない。"
  - no: 2
    based_on: 1
    text: "公金その他の公の財産は、国若しくは地方自治体その他の公共団体の監督が及ばない慈善、教育若しくは博愛の事業に対して支出し、又はその利用に供してはならない。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
