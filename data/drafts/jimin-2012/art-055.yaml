id: art-055
title: "議員資格争訟を「裁判する」から「審査し、議決する」に変更"
is_new: false
renamed_from: null
chapter: 第四章
number: 55
paragraphs:
  - no: 1
    text: "両議院は、各々その議員の資格に関し争いがあるときは、これについて審査し、議決する。ただし、議員の議席を失わせるには、出席議員の三分の二以上の多数による議決を必要とする。"
