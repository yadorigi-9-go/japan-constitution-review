id: art-020
title: "政教分離の要件を変更(「政治上の権力の行使」禁止を削除、社会的儀礼・習俗的行為の例外を新設)"
is_new: false
renamed_from: null
chapter: 第三章
number: 20
paragraphs:
  - no: 1
    text: "信教の自由は、保障する。国は、いかなる宗教団体に対しても、特権を与えてはならない。"
  - no: 2
    text: "何人も、宗教上の行為、祝典、儀式又は行事に参加することを強制されない。"
  - no: 3
    text: "国及び地方自治体その他の公共団体は、特定の宗教のための教育その他の宗教的活動をしてはならない。ただし、社会的儀礼又は習俗的行為の範囲を超えないものについては、この限りでない。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
