id: art-028
title: "公務員の労働基本権を法律により制限できる規定を新設"
is_new: false
renamed_from: null
chapter: 第三章
number: 28
paragraphs:
  - no: 1
    text: "勤労者の団結する権利及び団体交渉その他の団体行動をする権利は、保障する。"
  - no: 2
    based_on: null
    text: "公務員については、全体の奉仕者であることに鑑み、法律の定めるところにより、前項に規定する権利の全部又は一部を制限することができる。この場合においては、公務員の勤労条件を改善するため、必要な措置が講じられなければならない。"
source_url: "https://storage.jimin.jp/pdf/news/policy/130250_1.pdf"
retrieved_at: 2026-11-01
