kind: article
id: art-080
chapter: 第六章
number: 80
paragraphs:
  - no: 1
    text: "下級裁判所の裁判官は、最高裁判所の指名した者の名簿によつて、内閣でこれを任命する。その裁判官は、任期を十年とし、再任されることができる。但し、法律の定める年齢に達した時には退官する。"
  - no: 2
    text: "下級裁判所の裁判官は、すべて定期に相当額の報酬を受ける。この報酬は、在任中、これを減額することができない。"
source_url: "https://laws.e-gov.go.jp/law/321CONSTITUTION"
retrieved_at: 2026-10-31
