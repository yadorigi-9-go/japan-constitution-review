kind: article
id: art-073
chapter: 第五章
number: 73
paragraphs:
  - no: 1
    text: "内閣は、他の一般行政事務の外、左の事務を行ふ。一法律を誠実に執行し、国務を総理すること。二外交関係を処理すること。三条約を締結すること。但し、事前に、時宜によつては事後に、国会の承認を経ることを必要とする。四法律の定める基準に従ひ、官吏に関する事務を掌理すること。五予算を作成して国会に提出すること。六この憲法及び法律の規定を実施するために、政令を制定すること。但し、政令には、特にその法律の委任がある場合を除いては、罰則を設けることができない。七大赦、特赦、減刑、刑の執行の免除及び復権を決定すること。"
source_url: "https://laws.e-gov.go.jp/law/321CONSTITUTION"
