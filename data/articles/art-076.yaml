kind: article
id: art-076
chapter: 第六章
number: 76
paragraphs:
  - no: 1
    text: "すべて司法権は、最高裁判所及び法律の定めるところにより設置する下級裁判所に属する。"
  - no: 2
    text: "特別裁判所は、これを設置することができない。行政機関は、終審として裁判を行ふことができない。"
  - no: 3
    text: "すべて裁判官は、その良心に従ひ独立してその職権を行ひ、この憲法及び法律にのみ拘束される。"
source_url: "https://laws.e-gov.go.jp/law/321CONSTITUTION"
retrieved_at: 2026-10-31
