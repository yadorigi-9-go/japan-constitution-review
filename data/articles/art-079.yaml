kind: article
id: art-079
chapter: 第六章
number: 79
paragraphs:
  - no: 1
    text: "最高裁判所は、その長たる裁判官及び法律の定める員数のその他の裁判官でこれを構成し、その長たる裁判官以外の裁判官は、内閣でこれを任命する。"
  - no: 2
    text: "最高裁判所の裁判官の任命は、その任命後初めて行はれる衆議院議員総選挙の際国民の審査に付し、その後十年を経過した後初めて行はれる衆議院議員総選挙の際更に審査に付し、その後も同様とする。"
  - no: 3
    text: "前項の場合において、投票者の多数が裁判官の罷免を可とするときは、その裁判官は、罷免される。"
  - no: 4
    text: "審査に関する事項は、法律でこれを定める。"
  - no: 5
    text: "最高裁判所の裁判官は、法律の定める年齢に達した時に退官する。"
  - no: 6
    text: "最高裁判所の裁判官は、すべて定期に相当額の報酬を受ける。この報酬は、在任中、これを減額することができない。"
source_url: "https://laws.e-gov.go.jp/law/321CONSTITUTION"
