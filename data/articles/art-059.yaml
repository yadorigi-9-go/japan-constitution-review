kind: article
id: art-059
chapter: 第四章
number: 59
paragraphs:
  - no: 1
    text: "法律案は、この憲法に特別の定のある場合を除いては、両議院で可決したとき法律となる。"
  - no: 2
    text: "衆議院で可決し、参議院でこれと異なつた議決をした法律案は、衆議院で出席議員の三分の二以上の多数で再び可決したときは、法律となる。"
  - no: 3
    text: "前項の規定は、法律の定めるところにより、衆議院が、両議院の協議会を開くことを求めることを妨げない。"
  - no: 4
    text: "参議院が、衆議院の可決した法律案を受け取つた後、国会休会中の期間を除いて六十日以内に、議決しないときは、衆議院は、参議院がその法律案を否決したものとみなすことができる。"
source_url: "https://laws.e-gov.go.jp/law/321CONSTITUTION"
retrieved_at: 2026-10-31
