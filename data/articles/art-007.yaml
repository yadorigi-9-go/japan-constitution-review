kind: article
id: art-007
chapter: 第一章
number: 7
paragraphs:
  - no: 1
    text: "天皇は、内閣の助言と承認により、国民のために、左の国事に関する行為を行ふ。一憲法改正、法律、政令及び条約を公布すること。二国会を召集すること。三衆議院を解散すること。四国会議員の総選挙の施行を公示すること。五国務大臣及び法律の定めるその他の官吏の任免並びに全権委任状及び大使及び公使の信任状を認証すること。六大赦、特赦、減刑、刑の執行の免除及び復権を認証すること。七栄典を授与すること。八批准書及び法律の定めるその他の外交文書を認証すること。九外国の大使及び公使を接受すること。十儀式を行ふこと。"
source_url: "https://laws.e-gov.go.jp/law/321CONSTITUTION"
retrieved_at: 2026-11-01
