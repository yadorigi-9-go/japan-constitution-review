kind: article
id: art-014
chapter: 第三章
number: 14
paragraphs:
  - no: 1
    text: "すべて国民は、法の下に平等であつて、人種、信条、性別、社会的身分又は門地により、政治的、経済的又は社会的関係において、差別されない。"
  - no: 2
    text: "華族その他の貴族の制度は、これを認めない。"
  - no: 3
    text: "栄誉、勲章その他の栄典の授与は、いかなる特権も伴はない。栄典の授与は、現にこれを有し、又は将来これを受ける者の一代に限り、その効力を有する。"
source_url: "https://laws.e-gov.go.jp/law/321CONSTITUTION"
retrieved_at: 2026-10-31
