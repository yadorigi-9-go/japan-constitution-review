kind: article
id: art-098
chapter: 第十章
number: 98
paragraphs:
  - no: 1
    text: "この憲法は、国の最高法規であつて、その条規に反する法律、命令、詔勅及び国務に関するその他の行為の全部又は一部は、その効力を有しない。"
  - no: 2
    text: "日本国が締結した条約及び確立された国際法規は、これを誠実に遵守することを必要とする。"
source_url: "https://laws.e-gov.go.jp/law/321CONSTITUTION"
retrieved_at: 2026-10-31
