kind: article
id: art-015
chapter: 第三章
number: 15
paragraphs:
  - no: 1
    text: "公務員を選定し、及びこれを罷免することは、国民固有の権利である。"
  - no: 2
    text: "すべて公務員は、全体の奉仕者であつて、一部の奉仕者ではない。"
  - no: 3
    text: "公務員の選挙については、成年者による普通選挙を保障する。"
  - no: 4
    text: "すべて選挙における投票の秘密は、これを侵してはならない。選挙人は、その選択に関し公的にも私的にも責任を問はれない。"
source_url: "https://laws.e-gov.go.jp/law/321CONSTITUTION"
retrieved_at: 2026-10-31
