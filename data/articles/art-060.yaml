kind: article
id: art-060
chapter: 第四章
number: 60
paragraphs:
  - no: 1
    text: "予算は、さきに衆議院に提出しなければならない。"
  - no: 2
    text: "予算について、参議院で衆議院と異なつた議決をした場合に、法律の定めるところにより、両議院の協議会を開いても意見が一致しないとき、又は参議院が、衆議院の可決した予算を受け取つた後、国会休会中の期間を除いて三十日以内に、議決しないときは、衆議院の議決を国会の議決とする。"
source_url: "https://laws.e-gov.go.jp/law/321CONSTITUTION"
retrieved_at: 2026-10-31
