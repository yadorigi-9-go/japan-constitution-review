kind: article
id: art-077
chapter: 第六章
number: 77
paragraphs:
  - no: 1
    text: "最高裁判所は、訴訟に関する手続、弁護士、裁判所の内部規律及び司法事務処理に関する事項について、規則を定める権限を有する。"
  - no: 2
    text: "検察官は、最高裁判所の定める規則に従はなければならない。"
  - no: 3
    text: "最高裁判所は、下級裁判所に関する規則を定める権限を、下級裁判所に委任することができる。"
source_url: "https://laws.e-gov.go.jp/law/321CONSTITUTION"
retrieved_at: 2026-10-31
