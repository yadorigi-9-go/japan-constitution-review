kind: article
id: art-038
chapter: 第三章
number: 38
paragraphs:
  - no: 1
    text: "何人も、自己に不利益な供述を強要されない。"
  - no: 2
    text: "強制、拷問若しくは脅迫による自白又は不当に長く抑留若しくは拘禁された後の自白は、これを証拠とすることができない。"
  - no: 3
    text: "何人も、自己に不利益な唯一の証拠が本人の自白である場合には、有罪とされ、又は刑罰を科せられない。"
source_url: "https://laws.e-gov.go.jp/law/321CONSTITUTION"
retrieved_at: 2026-10-31
