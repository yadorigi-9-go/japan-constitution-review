kind: article
id: art-082
chapter: 第六章
number: 82
paragraphs:
  - no: 1
    text: "裁判の対審及び判決は、公開法廷でこれを行ふ。"
  - no: 2
    text: "裁判所が、裁判官の全員一致で、公の秩序又は善良の風俗を害する虞があると決した場合には、対審は、公開しないでこれを行ふことができる。但し、政治犯罪、出版に関する犯罪又はこの憲法第三章で保障する国民の権利が問題となつてゐる事件の対審は、常にこれを公開しなければならない。"
source_url: "https://laws.e-gov.go.jp/law/321CONSTITUTION"
retrieved_at: 2026-10-31
