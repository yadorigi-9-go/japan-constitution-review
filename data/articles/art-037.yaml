kind: article
id: art-037
chapter: 第三章
number: 37
paragraphs:
  - no: 1
    text: "すべて刑事事件においては、被告人は、公平な裁判所の迅速な公開裁判を受ける権利を有する。"
  - no: 2
    text: "刑事被告人は、すべての証人に対して審問する機会を充分に与へられ、又、公費で自己のために強制的手続により証人を求める権利を有する。"
  - no: 3
    text: "刑事被告人は、いかなる場合にも、資格を有する弁護人を依頼することができる。被告人が自らこれを依頼することができないときは、国でこれを附する。"
source_url: "https://laws.e-gov.go.jp/law/321CONSTITUTION"
retrieved_at: 2026-10-31
